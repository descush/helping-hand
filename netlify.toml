# Netlify builds the React app in frontend/helping-hand
[build]
  base = "frontend/helping-hand"
  command = "npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "20"

# Single-page app: let React Router handle every path
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
